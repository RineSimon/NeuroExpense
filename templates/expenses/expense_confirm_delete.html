{% extends 'base.html' %}

{% block title %}Delete Expense | SmartExp{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
    <div class="glass p-10 rounded-[40px] shadow-2xl text-center">
        <div class="w-20 h-20 bg-red-100 text-red-500 rounded-full flex items-center justify-center mx-auto mb-8">
            <i data-lucide="alert-triangle" class="w-10 h-10"></i>
        </div>
        <h2 class="text-2xl font-bold mb-4">Are you sure?</h2>
        <p class="text-slate-500 mb-8">
            You are about to delete "<strong>{{ expense.title }}</strong>" for <strong>₹{{ expense.amount }}</strong>. This action cannot be undone.
        </p>

        <form method="post" class="space-y-4">
            {% csrf_token %}
            <button type="submit" class="w-full py-4 bg-red-500 text-white rounded-2xl font-bold text-lg hover:bg-red-600 transition-all shadow-xl shadow-red-500/20">
                Yes, Delete It
            </button>
            <a href="{% url 'expenses:list' %}" class="block w-full py-4 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 rounded-2xl font-bold text-lg hover:bg-slate-200 transition-all">
                No, Keep It
            </a>
        </form>
    </div>
</div>
{% endblock %}
