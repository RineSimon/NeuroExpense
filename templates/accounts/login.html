{% extends 'base.html' %}

{% block auth_content %}
<div class="min-h-screen flex items-center justify-center bg-slate-50 relative overflow-hidden px-6">
    <!-- Animated Blobs -->
    <div class="absolute top-0 -left-20 w-96 h-96 bg-primary/20 rounded-full blur-[100px] animate-pulse"></div>
    <div class="absolute bottom-0 -right-20 w-96 h-96 bg-secondary/20 rounded-full blur-[100px] animate-pulse"></div>

    <div class="w-full max-w-md relative">
        <div class="glass p-10 rounded-[40px] shadow-2xl border border-white/50">
            <div class="text-center mb-10">
                <div class="w-16 h-16 bg-primary rounded-2xl flex items-center justify-center text-white mx-auto mb-6 shadow-xl shadow-primary/30">
                    <i data-lucide="lock" class="w-8 h-8"></i>
                </div>
                <h2 class="text-3xl font-bold">Welcome Back</h2>
                <p class="text-slate-500 mt-2">Log in to manage your finances.</p>
            </div>

            <form method="post" class="space-y-6">
                {% csrf_token %}
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">Username</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400">
                            <i data-lucide="user" class="w-5 h-5"></i>
                        </span>
                        <input type="text" name="username" required class="w-full pl-12 pr-4 py-4 bg-white/50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all" placeholder="Enter username">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">Password</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400">
                            <i data-lucide="key" class="w-5 h-5"></i>
                        </span>
                        <input type="password" name="password" required class="w-full pl-12 pr-12 py-4 bg-white/50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all" placeholder="••••••••">
                        <button type="button" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-slate-600">
                            <i data-lucide="eye" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>

                <div class="flex items-center justify-between text-sm">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" class="w-4 h-4 rounded border-slate-300 text-primary focus:ring-primary">
                        <span class="text-slate-600 font-medium">Remember me</span>
                    </label>
                    <a href="#" class="text-primary font-bold hover:underline">Forgot password?</a>
                </div>

                <button type="submit" class="w-full py-4 bg-primary text-white rounded-2xl font-bold text-lg hover:scale-[1.02] transition-all shadow-xl shadow-primary/20 mt-4">
                    Sign In
                </button>
            </form>

            <div class="mt-10 text-center">
                <p class="text-slate-500">Don't have an account? <a href="{% url 'accounts:signup' %}" class="text-primary font-bold hover:underline">Sign up for free</a></p>
            </div>
            
            <!-- Social Login UI (Visual Only) -->
            <div class="mt-10 pt-8 border-t border-slate-200">
                <p class="text-xs font-bold text-slate-400 uppercase tracking-widest text-center mb-6">Or continue with</p>
                <div class="grid grid-cols-2 gap-4">
                    <button class="flex items-center justify-center gap-3 py-3 border border-slate-200 rounded-xl hover:bg-slate-50 transition-colors">
                        <img src="https://www.google.com/favicon.ico" class="w-4 h-4">
                        <span class="text-sm font-bold">Google</span>
                    </button>
                    <button class="flex items-center justify-center gap-3 py-3 border border-slate-200 rounded-xl hover:bg-slate-50 transition-colors">
                        <img src="https://github.com/favicon.ico" class="w-4 h-4">
                        <span class="text-sm font-bold">GitHub</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
